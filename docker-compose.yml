version: "3.9"

services:
  medcore-db:
    image: postgres:18
    container_name: medcore-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${MEDCORE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MEDCORE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MEDCORE_POSTGRES_DB}
    volumes:
      - medcore_data:/var/lib/postgresql
    networks:
      - mynetwork
    ports:
      - ${MEDCORE_POSTGRES_PORT}:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $MEDCORE_POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

networks:
  mynetwork:
    driver: bridge

volumes:
  medcore_data:
  rabbitmq_data:
  redis_data: