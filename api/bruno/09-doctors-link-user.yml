info:
  name: 09 Doctors - link user
  type: http
  seq: 16

http:
  method: PATCH
  url: http://localhost:8081/api/v1/doctors/{{doctor_id}}/user
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "user_id": "{{user_id}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
