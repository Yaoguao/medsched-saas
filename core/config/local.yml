env: "dev"
http_server:
  address: ":8081"
  timeout: 4s
  idle_timeout: 60s
storage:
  postgres:
    max_open_conns: 50
    max_idle_conns: 50
    max_idle_time: 10m
    conn_attempts: 10
    base_retry_delay: 100ms
    max_retry_delay: 5s
auth:
  token_secret: "dev-secret-change-me"
  token_ttl: 24h
ml:
  base_url: "http://localhost:8000"
  timeout: 3s
  dataset_service_token: "dev-ml-dataset-token"
  admin_token: "dev-ml-admin-token"
notifier:
  base_url: "http://localhost:8082"
  timeout: 3s
  enabled: true
  callback_secret: "dev-notifier-callback-secret"
fhir:
  enabled: false
  code: "clinic-fhir"
  name: "Clinic FHIR R4"
  base_url: ""
  timeout: 5s
jobs:
  auto_no_show:
    enabled: true
    interval: 1m
    grace: 30m
    limit: 100
  ml_training:
    enabled: true
    interval: 10s
    timeout: 30m
    python_path: "../ml-service/.venv/bin/python"
    work_dir: "../ml-service"
    core_url: "http://localhost:8081"
    data_path: "../healthcare_noshows.csv"
    models_dir: "artifacts/models"
    metrics_path: "artifacts/metrics.json"
    max_output_size: 1048576
bootstrap:
  admin:
    enabled: true
    email: "admin@example.com"
    phone: "+79990000000"
    password: "admin12345"
